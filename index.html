<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2e;
  --panel2:#11243c;
  --line:#203650;
  --text:#f5f7fb;
  --muted:#9fb0c5;
  --gold:#f5c451;
  --green:#48d597;
  --blue:#5da9ff;
  --red:#ff6b7a;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:20px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,"Noto Sans Myanmar",Arial,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(93,169,255,.10),transparent 30%),
    radial-gradient(circle at bottom left,rgba(245,196,81,.07),transparent 30%),
    var(--bg);
  color:var(--text);
}

button,input{font:inherit}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  background:rgba(7,17,31,.96);
  border-right:1px solid var(--line);
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  padding:20px 14px;
  overflow:auto;
}

.brand{
  padding:8px 12px 22px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}

.brand-title{
  font-size:21px;
  font-weight:900;
  letter-spacing:.3px;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:13px 14px;
  margin:3px 0;
  border-radius:13px;
  cursor:pointer;
}

.nav-btn:hover,
.nav-btn.active{
  background:var(--panel2);
  color:white;
}

.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-height:100vh;
}

.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  background:rgba(7,17,31,.78);
  backdrop-filter:blur(16px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
  position:sticky;
  top:0;
  z-index:30;
}

.menu{
  display:none;
  background:transparent;
  color:white;
  border:0;
  font-size:25px;
}

.content{
  max-width:1500px;
  margin:auto;
  padding:28px;
}

.hero{
  background:
    linear-gradient(135deg,rgba(93,169,255,.13),rgba(245,196,81,.08)),
    var(--panel);
  border:1px solid var(--line);
  border-radius:28px;
  padding:30px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,4vw,48px);
  line-height:1.1;
}

.hero p{
  color:var(--muted);
  max-width:850px;
  line-height:1.8;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.badge{
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:#dce7f5;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.kpi-number{
  font-size:32px;
  font-weight:900;
}

.muted{
  color:var(--muted);
}

.section-title{
  margin:28px 0 14px;
  font-size:22px;
}

.module{
  margin-bottom:18px;
}

.module-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.lesson-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.lesson{
  border:1px solid var(--line);
  background:var(--panel);
  padding:16px;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.lesson:hover{
  transform:translateY(-2px);
  border-color:#42668d;
}

.lesson-number{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
}

.lesson-title{
  margin-top:6px;
  font-weight:800;
}

.master-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.master{
  padding:6px 9px;
  background:rgba(93,169,255,.09);
  border:1px solid rgba(93,169,255,.22);
  border-radius:999px;
  font-size:11px;
  color:#bcdcff;
}

.search{
  width:min(430px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  color:white;
  border-radius:12px;
  padding:11px 13px;
  outline:none;
}

.lesson-view{
  max-width:1100px;
  margin:auto;
}

.back-btn,
.primary-btn,
.secondary-btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
}

.back-btn,
.secondary-btn{
  background:var(--panel2);
  color:white;
  border:1px solid var(--line);
}

.primary-btn{
  background:var(--gold);
  color:#16120a;
  font-weight:900;
}

.lesson-head{
  margin:18px 0 22px;
}

.lesson-head h1{
  font-size:clamp(28px,4vw,45px);
  margin:12px 0;
}

.trainer{
  background:linear-gradient(135deg,rgba(245,196,81,.10),rgba(93,169,255,.08));
  border:1px solid rgba(245,196,81,.22);
  padding:20px;
  border-radius:20px;
  line-height:1.8;
}

.master-mix{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0;
}

.master-pill{
  background:#172c46;
  border:1px solid #2c4a6c;
  color:#dbeaff;
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;

.lesson-section{
  margin-top:18px;
}

.lesson-section h3{
  margin-bottom:8px;
}

.lesson-section p,
.lesson-section li{
  color:#d6dfeb;
  line-height:1.9;

.example{
  border-left:4px solid var(--green);
  background:rgba(72,213,151,.06);
  padding:18px;
  border-radius:12px;
}

.case{
  border-left:4px solid var(--blue);
  background:rgba(93,169,255,.06);
  padding:18px;
  border-radius:12px;
}

.practice{
  border-left:4px solid var(--gold);
  background:rgba(245,196,81,.06);
  padding:18px;
  border-radius:12px;
}

.quiz{
  margin-top:22px;

.quiz-question{
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;

  width:100%;
  padding:12px;
  margin-top:8px;
  text-align:left;
  border:1px solid var(--line);
  background:#0a1728;
  color:white;
  border-radius:10px;
  cursor:pointer;
}

.option.correct{
  border-color:var(--green);
  background:rgba(72,213,151,.12);
}

.option.wrong{
  border-color:var(--red);
  background:rgba(255,107,122,.10);
}

.feedback{
  margin-top:10px;
  color:var(--muted);
  line-height:1.7;
}

/* VISUAL EXPLANATION */

.visual-card{

  border-radius:18px;
  border:1px solid var(--line);

  margin-top:18px;
  padding:20px;
  border-radius:18px;

  font-weight:700;
  line-height:1.8;

.progress{
  height:8px;
  background:#13243a;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;

.progress span{
  display:block;
  height:100%;
  background:var(--gold);
  width:0;

.empty{
  padding:40px;
  text-align:center;
  color:var(--muted);

.overlay{
  display:none;

@media(max-width:1050px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:40;
  }

  .overlay.show{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu{

  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:16px;
  }

  .hero{
    padding:22px;
  }

  .grid{

  .lesson-list{
    grid-template-columns:1fr;
  }

    grid-template-columns:1fr;
  }

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{

  }

/* =========================================================
   BUILD ALL 230 LESSONS
========================================================= */

const lessons = [];

let lessonId = 1;

modules.forEach(module=>{
  module.lessons.forEach(title=>{

    let data = lessonBlueprints[lessonId];

    if(!data){
      data = makeAutoLesson(
        lessonId,
        module.id,
        title
      );
    }

    lessons.push({
      id:lessonId,
      moduleId:module.id,
      moduleTitle:module.title,
      title,
      duration:"7–10 min",
      ...data
    });

    lessonId++;
  });
});

/* =========================================================

========================================================= */

function renderQuiz(l){

  const questions = [
    {
      q:`${l.title} ကိုအသုံးချတဲ့အခါ အဓိကစဉ်းစားသင့်တာကဘာလဲ`,
      options:[
        "Activity တစ်ခုတည်း",
        "Business Result နဲ့ Action",
        "Report အလှ",
        "Meeting အချိန်"
      ],
      answer:1
    },
    {
      q:"Manager က problem တစ်ခုတွေ့ရင် ဘာကိုအရင်ရှာသင့်သလဲ",
      options:[
        "အပြစ်ရှိသူ",
        "Excuse",
        "Data နဲ့ Root Cause",
        "Report format"
      ],
      answer:2
    }
  ];

  return `
    <div class="quiz">

      <h2>🧠 Quick Quiz</h2>

      ${questions.map((q,qi)=>`

        <div class="quiz-question">

          <strong>
            ${qi+1}. ${q.q}
          </strong>

          <div id="quiz-${l.id}-${qi}">

            ${q.options.map((o,oi)=>`

              <button
                class="option"
                onclick="
                  answerQuiz(
                    this,
                    ${l.id},
                    ${qi},
                    ${oi},
                    ${q.answer}
                  )
                ">
                ${o}
              </button>

            `).join("")}

          </div>

          <div
            class="feedback"
            id="feedback-${l.id}-${qi}">
          </div>

        </div>

      `).join("")}

    </div>
  `;
}

function answerQuiz(btn,id,qi,selected,correct){

  const parent =
    btn.parentElement;

  [...parent.children].forEach(
    b=>b.disabled=true
  );

  const feedback =
    document.getElementById(
      `feedback-${id}-${qi}`
    );

  if(selected===correct){

    btn.classList.add("correct");

    feedback.innerHTML =
      "✓ Correct — ဒီ concept ကို business situation နဲ့ချိတ်စဉ်းစားနိုင်ရမယ်";

  }else{

    btn.classList.add("wrong");

    parent.children[correct]
      .classList.add("correct");

    feedback.innerHTML =
      "ပြန်စဉ်းစားပါ — Manager က symptom ထက် data, root cause နဲ့ action ကိုကြည့်ရမယ်";
  }
}

function calcKPI(){

  const target =
    Number(document.getElementById("target").value);

  const actual =
    Number(document.getElementById("actual").value);

  if(!target){
    document.getElementById("kpiResult").innerHTML =
      "Target ထည့်ပါ";
    return;
  }

  const achievement =
    (actual / target) * 100;

  const gap =
    target - actual;

  document.getElementById("kpiResult").innerHTML = `
    <strong>
      Achievement: ${achievement.toFixed(1)}%
    </strong>
    <br>
    <span class="muted">
      Gap: ${gap.toFixed(1)}
    </span>
  `;
}
