<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Aung Business Academy — Master Classroom Pro V2</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#080d18;
  --panel:#101827;
  --panel2:#151f31;
  --line:#243047;
  --text:#f4f7fb;
  --muted:#9ba8bd;
  --gold:#f5c451;
  --green:#31d69a;
  --blue:#5ca9ff;
  --red:#ff6b7a;
  --shadow:0 15px 45px rgba(0,0,0,.25)
}
body{
  margin:0;
  background:linear-gradient(135deg,#070b14,#0d1525);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Myanmar",sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
  width:270px;
  background:#0b111e;
  border-right:1px solid var(--line);
  position:fixed;
  left:0;top:0;bottom:0;
  z-index:20;
  overflow:auto
}
.logo{
  padding:22px 20px;
  border-bottom:1px solid var(--line)
}
.logo h1{font-size:20px;margin:0;color:var(--gold)}
.logo p{font-size:12px;color:var(--muted);margin:6px 0 0}
.nav{padding:14px}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#b7c1d2;
  text-align:left;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:5px
}
.nav button:hover,.nav button.active{
  background:#172238;
  color:white
}
.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-width:0
}
.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  background:rgba(8,13,24,.9);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:10
}
.menu{display:none}
.search{
  flex:1;
  max-width:500px;
  background:#111b2b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 14px;
  color:white;
  outline:none
}
.content{padding:25px;max-width:1500px;margin:auto}
.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}
.page-title h2{margin:0;font-size:27px}
.page-title p{color:var(--muted);margin:6px 0 0}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px
}
.card{
  background:linear-gradient(145deg,#111b2b,#0d1625);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow)
}
.stat .num{font-size:30px;font-weight:800;margin-top:8px}
.stat .label{color:var(--muted);font-size:13px}
.gold{color:var(--gold)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.muted{color:var(--muted)}
.btn{
  border:1px solid var(--line);
  background:#172237;
  color:white;
  border-radius:10px;
  padding:10px 14px
}
.btn:hover{filter:brightness(1.15)}
.btn.goldBtn{
  background:var(--gold);
  color:#151515;
  border-color:var(--gold);
  font-weight:700
}
.btn.danger{color:#ff9ba6}
.lesson-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px
}
.lesson-card{
  background:#101a2a;
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  transition:.2s
}
.lesson-card:hover{
  transform:translateY(-2px);
  border-color:#40506c
}
.lesson-num{font-size:12px;color:var(--gold)}
.lesson-card h3{font-size:16px;margin:8px 0}
.lesson-card p{font-size:12px;color:var(--muted)}
.master-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 9px;
  background:#19243a;
  border-radius:999px;
  color:#dbe6f8;
  font-size:11px
}
.master-avatar{
  width:58px;height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#283b60,#151f33);
  border:2px solid var(--gold);
  font-size:22px;
  font-weight:800;
  flex:none
}
.master-head{
  display:flex;
  gap:16px;
  align-items:center
}
.master-head h3{margin:0 0 5px}
.master-head p{margin:0;color:var(--muted);font-size:13px}
.master-card{min-height:180px}
.classroom{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px
}
.hero{
  background:linear-gradient(135deg,#15233a,#0e1727);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  margin-bottom:18px
}
.hero h1{margin:10px 0;font-size:32px}
.hero .intro{
  color:#c6d0df;
  line-height:1.8
}
.section{
  background:#101a29;
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px;
  margin-bottom:14px
}
.section h3{margin-top:0;color:var(--gold)}
.section p,.section li{
  color:#d0d8e5;
  line-height:1.9;
  font-size:14px
}
.visual{
  border:1px solid #31415c;
  border-radius:16px;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#253b5e,transparent 35%),
    linear-gradient(145deg,#111c2d,#0c1422);
  margin-bottom:14px
}
.visual-flow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-top:15px
}
.flow-box{
  padding:10px 12px;
  background:#19263c;
  border:1px solid #344766;
  border-radius:10px;
  font-size:12px
}
.arrow{color:var(--gold)}
.side-sticky{position:sticky;top:90px}
.progressbar{
  height:9px;
  background:#1a2538;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px
}
.progressbar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--gold),#ffe08a);
  border-radius:999px
}
.option{
  display:block;
  width:100%;
  text-align:left;
  margin:8px 0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#131e30;
  color:#dbe4f1
}
.option.correct{border-color:var(--green);background:#102c26}
.option.wrong{border-color:var(--red);background:#2c151c}
.note{
  width:100%;
  min-height:140px;
  resize:vertical;
  background:#0c1422;
  border:1px solid var(--line);
  color:white;
  border-radius:12px;
  padding:13px;
  outline:none
}
.tool-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px
}
.field{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0d1625;
  color:white;
  margin:7px 0 12px;
  outline:none
}
.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted)
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:15
}
.small{font-size:12px}
@media(max-width:1100px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lesson-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tool-grid{grid-template-columns:1fr}
}
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s
  }
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .main{
    margin-left:0;
    width:100%
  }
  .menu{
    display:block;
    background:transparent;
    border:0;
    color:white;
    font-size:22px
  }
  .topbar{padding:0 13px}
  .search{max-width:none}
  .content{padding:16px}
  .classroom{grid-template-columns:1fr}
  .side-sticky{position:static}
}
@media(max-width:560px){
  .grid,.lesson-grid{grid-template-columns:1fr}
  .page-title{align-items:flex-start;flex-direction:column}
  .hero h1{font-size:25px}
  .hero{padding:18px}
  .section{padding:16px}
}
</style>
</head>

</div>

function escapeHTML(str=""){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}

function masterFor(id){
  /*
    Master mapping is topic-based instead of random only
  */
  const l=lessons.find(x=>x.id===id);
  if(!l)return masters[0];

  const title=l.title.toLowerCase();

  if(/kpi|target|performance|management|manager|objective|review/.test(title))
    return masters.find(x=>x.name==="Peter Drucker");

  if(/leadership|priority|time|delegation|empowerment/.test(title))
    return masters.find(x=>x.name==="Stephen Covey");

  if(/why|purpose|communication|meeting|culture/.test(title))
    return masters.find(x=>x.name==="Simon Sinek");

  if(/strategy|growth|discipline|system|process/.test(title))
    return masters.find(x=>x.name==="Jim Collins");

  if(/finance|profit|margin|roi|long|value/.test(title))
    return masters.find(x=>x.name==="Warren Buffett");

  if(/problem|decision|root|5 why|pareto/.test(title))
    return masters.find(x=>x.name==="Charlie Munger");

  if(/communication|feedback|conflict|customer complaint/.test(title))
    return masters.find(x=>x.name==="Dale Carnegie");

  if(/sales|goal|action|closing/.test(title))
    return masters.find(x=>x.name==="Brian Tracy");

  if(/customer|value|service|loyalty/.test(title))
    return masters.find(x=>x.name==="Zig Ziglar");

  if(/account|question|need|discovery|negotiation/.test(title))
    return masters.find(x=>x.name==="Neil Rackham");

  if(/marketing|segment|market|customer/.test(title))
    return masters.find(x=>x.name==="Philip Kotler");

  if(/competitor|channel|position|advantage/.test(title))
    return masters.find(x=>x.name==="Michael Porter");

  if(/people|emotion|motivation|trust/.test(title))
    return masters.find(x=>x.name==="Daniel Goleman");

  if(/learning|development|coaching|skill/.test(title))
    return masters.find(x=>x.name==="Carol Dweck");

  if(/habit|daily|improvement|execution/.test(title))
    return masters.find(x=>x.name==="James Clear");

  if(/coaching|performance|team/.test(title))
    return masters.find(x=>x.name==="Ken Blanchard");

  if(/leadership|influence/.test(title))
    return masters.find(x=>x.name==="John Maxwell");

  if(/focus|productivity/.test(title))
    return masters.find(x=>x.name==="Cal Newport");

  return masters[(id-1)%masters.length];
}

function getLesson(id){
  if(specialContent[id]){
    const item=lessons.find(x=>x.id===id);
    return {
      ...specialContent[id],
      id,
      title:item.title,
      module:item.module,
      duration:"7–10 min",
      master:masterFor(id),
      visual:{
        title:"People + Numbers + Execution",
        description:"Result → Data → Problem → Root Cause → Action → Follow-up → Result"
      }
    };
  }
  return genericLesson(id);
}

    <p class="small muted">Source / Concept: ${escapeHTML(m.source)}</p>
   </div>
  </div>

  <div style="height:15px"></div>

  ${l.sections.map((s,i)=>`
   <div class="section">
    <h3>${i+1}. ${escapeHTML(s.title)}</h3>
    <p>${escapeHTML(s.explanation ?? s.body ?? "")}</p>
   </div>
  `).join("")}

  <div class="visual">
   <h3>🖼️ Visual Learning</h3>
   <p class="muted">${escapeHTML(l.visual.description)}</p>

   <div class="visual-flow">
    <div class="flow-box">MASTER IDEA</div>
    <span class="arrow">→</span>
    <div class="flow-box">TRAINER</div>
    <span class="arrow">→</span>
    <div class="flow-box">BUSINESS DATA</div>
    <span class="arrow">→</span>
    <div class="flow-box">ACTION</div>
    <span class="arrow">→</span>
    <div class="flow-box">RESULT</div>
   </div>

   <p class="small muted" style="margin-top:16px">
    Visual concept: ${escapeHTML(l.visual.title)}
   </p>
  </div>

  <div class="section">
   <h3>💼 Real Business Example</h3>
   <p>${escapeHTML(l.example || "")}</p>
  </div>

  <div class="section">
   <h3>🧩 Case Study</h3>
   <p>${escapeHTML(l.case || "")}</p>
  </div>

  <div class="section">
   <h3>✍️ Practice</h3>
   <p>${escapeHTML(l.practice || "")}</p>

   <textarea class="note" id="practiceBox"
    placeholder="ဒီ Lesson ကို Business မှာ ဘယ်လိုအသုံးချမလဲ ရေးပါ">${escapeHTML(state.notes["practice_"+l.id]||"")}</textarea>

   <button class="btn goldBtn" style="margin-top:10px"
    onclick="savePractice(${l.id})">Save Practice</button>
  </div>

  <div class="section">
   <h3>📝 Knowledge Check</h3>
   ${l.quiz.map((q,qi)=>`
    <div style="margin-bottom:25px">
     <p><strong>${qi+1}. ${escapeHTML(q.question ?? q.q)}</strong></p>
     ${(q.options||[]).map((op,oi)=>`
      <button class="option"
       onclick="answerQuiz(${l.id},${qi},${oi},this)">
       ${String.fromCharCode(65+oi)}. ${escapeHTML(op)}
      </button>
     `).join("")}
     <div id="quizExplain_${l.id}_${qi}" class="small muted"></div>
    </div>
   `).join("")}
  </div>

  <div class="section">
   <h3>🚀 Apply Today</h3>
   <p>${escapeHTML(l.apply || l.applyToday || "")}</p>
  </div>

  <div style="display:flex;justify-content:space-between;gap:10px">
   <button class="btn" onclick="previousLesson()">← Previous</button>
   <button class="btn goldBtn" onclick="nextLesson()">Next Lesson →</button>
  </div>

 </div>

 <aside>
  <div class="side-sticky">
   <div class="card">
    <div class="small muted">LEARNING PROGRESS</div>
    <div style="font-size:30px;font-weight:800;margin-top:5px">
     ${progress()}%
    </div>
    <div class="progressbar">
     <span style="width:${progress()}%"></span>
    </div>
    <p class="small muted">${state.completed.length} / 230 lessons completed</p>
   </div>

   <div class="card" style="margin-top:15px">
    <div class="small muted">CURRENT MASTER</div>
    <h3>${escapeHTML(m.name)}</h3>
    <p class="muted">${escapeHTML(m.concept)}</p>
    <button class="btn" onclick="showPage('masters')">Master Library</button>
   </div>

   <div class="card" style="margin-top:15px">
    <div class="small muted">MY NOTE</div>
    <textarea class="note" id="lessonNote"
     placeholder="ဒီ Lesson အတွက် note ရေးပါ">${escapeHTML(state.notes["lesson_"+l.id]||"")}</textarea>
    <button class="btn" style="margin-top:8px;width:100%"
     onclick="saveLessonNote(${l.id})">Save Note</button>
   </div>
  </div>
 </aside>

 </div>`;
}

function tools(){
 return `
 ${pageTitle("Manager Tools","Practical calculators for Sales Managers")}

 <div class="tool-grid">

  <div class="card">
   <h3>📊 KPI Achievement</h3>
   <label class="small muted">Target</label>
   <input id="kpiTarget" class="field" type="number" placeholder="500">
   <label class="small muted">Actual</label>
   <input id="kpiActual" class="field" type="number" placeholder="420">
   <button class="btn goldBtn" onclick="calcKPI()">Calculate</button>
   <div id="kpiResult" style="margin-top:15px"></div>
  </div>

  <div class="card">
   <h3>📈 Forecast</h3>
   <label class="small muted">Current Actual</label>
   <input id="fcActual" class="field" type="number" placeholder="420">
   <label class="small muted">Elapsed Days</label>
   <input id="fcDays" class="field" type="number" placeholder="15">
   <label class="small muted">Month Days</label>
   <input id="fcMonth" class="field" type="number" value="30">
   <button class="btn goldBtn" onclick="calcForecast()">Calculate</button>
   <div id="fcResult" style="margin-top:15px"></div>
  </div>

  <div class="card">
   <h3>🗺️ PJP Coverage</h3>
   <label class="small muted">Planned Calls</label>
   <input id="pjpPlan" class="field" type="number" placeholder="100">
   <label class="small muted">Visited Calls</label>
   <input id="pjpVisit" class="field" type="number" placeholder="85">
   <label class="small muted">Productive Calls</label>
   <input id="pjpProd" class="field" type="number" placeholder="60">
   <button class="btn goldBtn" onclick="calcPJP()">Calculate</button>
   <div id="pjpResult" style="margin-top:15px"></div>
  </div>

 </div>`;
}

function notesPage(){
 const entries=Object.entries(state.notes).filter(([k,v])=>v);

 return `
 ${pageTitle("My Notes","Your saved learning notes and practice")}

 ${entries.length?entries.map(([key,value])=>`
  <div class="card" style="margin-bottom:12px">
   <div class="small gold">${escapeHTML(key)}</div>
   <p style="white-space:pre-wrap;line-height:1.8">${escapeHTML(value)}</p>
  </div>
 `).join(""):`
 <div class="card empty">
  <div style="font-size:40px">📝</div>
  <p>No notes yet</p>
 </div>`}`;
}

function favorites(){
 const list=lessons.filter(l=>state.favorites.includes(l.id));

 return `
 ${pageTitle("Favorites","Lessons you want to review again")}

 ${list.length?`
 <div class="lesson-grid">
 ${list.map(l=>`
  <div class="lesson-card">
   <div class="lesson-num">LESSON ${l.id}</div>
   <h3>${escapeHTML(l.title)}</h3>
   <p>${escapeHTML(l.module)}</p>
   <button class="btn" onclick="openLesson(${l.id})">Open</button>
  </div>
 `).join("")}
 </div>`
 :`<div class="card empty">⭐ No favorite lessons yet</div>`}`;
}

function settings(){
 return `
 ${pageTitle("Settings","Academy preferences")}

 <div class="card">
  <h3>🎤 Trainer Voice</h3>
  <p class="muted">Browser Text-to-Speech ကိုအသုံးပြုပြီး Lesson ကို အသံနဲ့နားထောင်နိုင်ပါတယ်</p>
  <button class="btn" onclick="state.voice=!state.voice;save();render()">
   ${state.voice?"Enabled":"Disabled"}
  </button>
 </div>

 <div style="height:15px"></div>

 <div class="card">
  <h3>💾 Local Data</h3>
  <p class="muted">Progress, Favorite နဲ့ Notes တွေကို ဒီ Browser ရဲ့ LocalStorage ထဲမှာ သိမ်းထားပါတယ်</p>
  <button class="btn danger" onclick="resetData()">Reset Academy Data</button>
 </div>`;
}

function masterLessons(index){
 const m=masters[index];
 const ids=lessons.filter(l=>masterFor(l.id).name===m.name).map(x=>x.id);

 state.page="courses";
 render();

 setTimeout(()=>{
  const root=document.getElementById("appContent");
  root.innerHTML=`
   ${pageTitle(m.name,`${m.field} · ${m.concept}`)}
   <div class="card" style="margin-bottom:18px">
    <div class="master-head">
     <div class="master-avatar">${m.icon}</div>
     <div>
      <h3>${escapeHTML(m.name)}</h3>
      <p>${escapeHTML(m.mindset)}</p>
     </div>
    </div>
   </div>

   <div class="lesson-grid">
    ${ids.map(id=>{
      const l=lessons.find(x=>x.id===id);
      return `
       <div class="lesson-card">
        <div class="lesson-num">LESSON ${id}</div>
        <h3>${escapeHTML(l.title)}</h3>
        <p>${escapeHTML(l.module)}</p>
        <button class="btn" onclick="openLesson(${id})">Open Lesson</button>
       </div>`;
    }).join("")}
   </div>`;
 },0);
}

function openLesson(id){
 state.current=id;
 state.page="classroom";
 save();
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function showPage(page){
 state.page=page;
 save();
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function toggleDone(id){
 if(isDone(id)){
  state.completed=state.completed.filter(x=>x!==id);
 }else{
  state.completed.push(id);
 }
 save();
 render();
}

function toggleFavorite(id){
 if(state.favorites.includes(id)){
  state.favorites=state.favorites.filter(x=>x!==id);
 }else{
  state.favorites.push(id);
 }
 save();
 render();
}

function savePractice(id){
 const el=document.getElementById("practiceBox");
 if(!el)return;
 state.notes["practice_"+id]=el.value;
 save();
 alert("Practice saved");
}

function saveLessonNote(id){
 const el=document.getElementById("lessonNote");
 if(!el)return;
 state.notes["lesson_"+id]=el.value;
 save();
 alert("Note saved");
}

function answerQuiz(id,qi,oi,btn){
 const l=getLesson(id);
 const q=l.quiz[qi];
 const correct=(q.answer??0);

 btn.parentElement.querySelectorAll(".option").forEach((b,i)=>{
  if(i===correct)b.classList.add("correct");
 });

 if(oi!==correct)btn.classList.add("wrong");

 const box=document.getElementById(`quizExplain_${id}_${qi}`);
 box.innerHTML=`
  ${oi===correct?"✅ Correct":"❌ Not correct"}
  <br>${escapeHTML(q.explanation ?? q.explain ?? "")}`;
}

function previousLesson(){
 if(state.current>1)openLesson(state.current-1);
}

function nextLesson(){
 if(state.current<230)openLesson(state.current+1);
}

function speakLesson(id){
 const l=getLesson(id);

 if(!("speechSynthesis" in window)){
  alert("ဒီ Browser မှာ Voice မရနိုင်ပါ");
  return;
 }

 speechSynthesis.cancel();

 const text=[
  l.title,
  l.trainerIntro,
  ...l.sections.map(x=>x.explanation??x.body??""),
  l.example||"",
  l.practice||"",
  l.apply||l.applyToday||""
 ].join(". ");

 const utter=new SpeechSynthesisUtterance(text);
 utter.lang="my-MM";
 utter.rate=.9;
 speechSynthesis.speak(utter);
}

function calcKPI(){
 const t=Number(document.getElementById("kpiTarget").value);
 const a=Number(document.getElementById("kpiActual").value);

 if(!t)return;

 const ach=a/t*100;
 const gap=t-a;

 document.getElementById("kpiResult").innerHTML=`
 <div class="card" style="padding:14px;background:#0c1422">
  <div class="small muted">Achievement</div>
  <div class="num green" style="font-size:28px">${ach.toFixed(1)}%</div>
  <div class="small muted">Gap</div>
  <div class="num gold" style="font-size:24px">${gap.toFixed(1)}</div>
 </div>`;
}

function calcForecast(){
 const a=Number(document.getElementById("fcActual").value);
 const d=Number(document.getElementById("fcDays").value);
 const m=Number(document.getElementById("fcMonth").value);

 if(!a||!d||!m)return;

 const forecast=a/d*m;

 document.getElementById("fcResult").innerHTML=`
 <div class="card" style="padding:14px;background:#0c1422">
  <div class="small muted">Projected Month Result</div>
  <div class="num blue" style="font-size:28px">${forecast.toFixed(1)}</div>
 </div>`;
}

function calcPJP(){
 const plan=Number(document.getElementById("pjpPlan").value);
 const visit=Number(document.getElementById("pjpVisit").value);
 const prod=Number(document.getElementById("pjpProd").value);

 if(!plan)return;

 const coverage=visit/plan*100;
 const strike=visit?prod/visit*100:0;

 document.getElementById("pjpResult").innerHTML=`
 <div class="card" style="padding:14px;background:#0c1422">
  <div class="small muted">Coverage</div>
  <div class="num green" style="font-size:25px">${coverage.toFixed(1)}%</div>
  <div class="small muted">Strike Rate</div>
  <div class="num gold" style="font-size:25px">${strike.toFixed(1)}%</div>
 </div>`;
}

function resetData(){
 if(confirm("Progress, Notes နဲ့ Favorites အားလုံးကို ဖျက်မလား")){
  localStorage.removeItem(STORAGE);
  location.reload();
 }
}

function searchLessons(q){
 q=q.trim().toLowerCase();

 if(!q){
  render();
  return;
 }

 const result=lessons.filter(l=>{
  const m=masterFor(l.id);
  return `${l.title} ${l.module} ${m.name} ${m.concept}`
   .toLowerCase().includes(q);
 });

 state.page="courses";

 document.getElementById("appContent").innerHTML=`
 ${pageTitle("Search Results",`${result.length} lessons found`)}

 ${result.length?
 `<div class="lesson-grid">
 ${result.map(l=>`
  <div class="lesson-card">
   <div class="lesson-num">LESSON ${l.id}</div>
   <h3>${escapeHTML(l.title)}</h3>
   <p>${escapeHTML(l.module)}</p>
   <span class="master-badge">${masterFor(l.id).icon} ${escapeHTML(masterFor(l.id).name)}</span>
   <button class="btn" style="width:100%;margin-top:12px"
    onclick="openLesson(${l.id})">Open Lesson</button>
  </div>
 `).join("")}
 </div>`
 :`<div class="card empty">Search result မတွေ့ပါ</div>`}`;
}

function bindPageEvents(){
 document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
   state.page=btn.dataset.page;
   save();
   render();
   closeMobileMenu();
  };
 });
}

function closeMobileMenu(){
 document.getElementById("sidebar").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
}

document.getElementById("menuBtn").onclick=()=>{
 document.getElementById("sidebar").classList.add("open");
 document.getElementById("overlay").classList.add("show");
};

document.getElementById("overlay").onclick=closeMobileMenu;

document.getElementById("continueBtn").onclick=()=>{
 openLesson(state.current);
};

document.getElementById("searchInput").addEventListener("input",e=>{
 searchLessons(e.target.value);
});

render();

</script>
</body>
</html>
