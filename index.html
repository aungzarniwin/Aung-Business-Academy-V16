<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Aung Business Academy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#697386;
  --line:#e5eaf2;
  --primary:#111827;
  --primary2:#1f2937;
  --accent:#d9a441;
  --accent2:#f2c66d;
  --success:#16a34a;
  --danger:#dc2626;
  --info:#2563eb;
  --shadow:0 12px 35px rgba(15,23,42,.08);
  --radius:18px;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Myanmar","Myanmar Text",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:270px;
  background:#111827;
  color:#fff;
  z-index:1000;
  padding:22px 16px;
  overflow-y:auto;
  transition:.25s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 10px 24px;
}

.brand-logo{
  width:45px;
  height:45px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#d9a441,#f4d18b);
  color:#111827;
  font-weight:900;
  font-size:20px;
}

.brand h1{
  font-size:17px;
  line-height:1.2;
}

.brand span{
  display:block;
  color:#9ca3af;
  font-size:11px;
  margin-top:4px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#1f2937;
  color:#fff;
}

.nav button.active{
  box-shadow:inset 3px 0 0 var(--accent);
}

.sidebar-footer{
  margin-top:30px;
  padding:14px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  color:#9ca3af;
  font-size:12px;
  line-height:1.6;
}

/* MAIN */
.main{
  margin-left:270px;
  min-height:100vh;
}

.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:900;
}

.menu-btn{
  display:none;
  border:0;
  background:#f1f5f9;
  width:42px;
  height:42px;
  border-radius:12px;
}

.top-title{
  font-weight:800;
}

.top-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.badge{
  background:#fff7df;
  color:#8a5d05;
  border:1px solid #f0d18b;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

/* COMMON */
.page-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:18px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

/* HERO */
.hero{
  background:
    radial-gradient(circle at 85% 15%,rgba(217,164,65,.25),transparent 28%),
    linear-gradient(135deg,#111827,#1f2937);
  color:#fff;
  border-radius:26px;
  padding:34px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.hero h2{
  font-size:32px;
  line-height:1.2;
  margin-bottom:12px;
}

.hero p{
  max-width:760px;
  color:#d1d5db;
  line-height:1.8;
}

.hero-actions{
  margin-top:22px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* BUTTON */
.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:750;
  transition:.2s;
}

.btn-primary{
  background:var(--accent);
  color:#111827;
}

.btn-primary:hover{
  background:var(--accent2);
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.btn-light{
  background:#f1f5f9;
  color:#1f2937;
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

.btn-danger{
  background:#fee2e2;
  color:#991b1b;
}

/* STATS */
.stat{
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
}

.stat-small{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

/* MODULE */
.module-card{
  padding:20px;
  position:relative;
  overflow:hidden;
}

.module-number{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#111827;
  color:#fff;
  font-weight:900;
  margin-bottom:15px;
}

.module-card h3{
  font-size:17px;
  margin-bottom:8px;
}

.module-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.progress{
  height:8px;
  background:#edf1f6;
  border-radius:99px;
  overflow:hidden;
  margin-top:15px;
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,#d9a441,#f2c66d);
  border-radius:99px;
}

/* COURSE */
.course-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.lesson-row{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:14px;
}

.lesson-number{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#f1f5f9;
  display:grid;
  place-items:center;
  font-weight:800;
  flex-shrink:0;
}

.lesson-row.completed .lesson-number{
  background:#dcfce7;
  color:#166534;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h4{
  font-size:15px;
  margin-bottom:4px;
}

.lesson-info p{
  font-size:12px;
  color:var(--muted);
}

.lesson-actions{
  display:flex;
  gap:7px;
}

/* CLASSROOM */
.classroom{
  max-width:950px;
  margin:auto;
}

.lesson-head{
  padding:25px;
  margin-bottom:18px;
}

.lesson-head-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.lesson-head h2{
  font-size:28px;
  margin-bottom:8px;
}

.lesson-meta{
  color:var(--muted);
  font-size:13px;
}

.lesson-progress{
  margin-top:18px;
}

.trainer-box{
  padding:24px;
  margin-bottom:18px;
  background:linear-gradient(135deg,#fff9eb,#fff);
  border:1px solid #f1d99b;
}

.trainer-label{
  color:#946b18;
  font-weight:900;
  font-size:13px;
  margin-bottom:10px;
}

.lesson-section{
  padding:25px;
  margin-bottom:16px;
}

.lesson-section h3{
  font-size:20px;
  margin-bottom:12px;
}

.explanation{
  color:#374151;
  line-height:1.95;
  white-space:pre-line;
}

.tip-box{
  padding:18px;
  border-left:4px solid var(--accent);
  background:#fffaf0;
  border-radius:10px;
  margin-top:15px;
}

.practice{
  padding:24px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:18px;
  margin-bottom:18px;
}

.practice h3{
  margin-bottom:12px;
}

.quiz-card{
  padding:24px;
  margin-bottom:18px;
}

.quiz-question{
  font-weight:850;
  font-size:17px;
  line-height:1.6;
  margin-bottom:15px;
}

.quiz-options{
  display:grid;
  gap:9px;
}

.quiz-option{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:13px;
  border-radius:11px;
  text-align:left;
}

.quiz-option:hover{
  border-color:#c7a14f;
}

.quiz-option.correct{
  background:#dcfce7;
  border-color:#86efac;
}

.quiz-option.wrong{
  background:#fee2e2;
  border-color:#fca5a5;
}

.quiz-explanation{
  margin-top:14px;
  padding:14px;
  background:#f8fafc;
  border-radius:10px;
  line-height:1.7;
  color:#475569;
}

.apply-box{
  padding:24px;
  background:#111827;
  color:#fff;
  border-radius:18px;
  margin-bottom:18px;
}

.apply-box h3{
  color:#f2c66d;
  margin-bottom:10px;
}

.lesson-nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:18px 0;
}

/* TOOLS */
.tool-card{
  padding:22px;
}

.tool-card h3{
  margin-bottom:8px;
}

.tool-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-bottom:16px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#c79b3d;
}

/* NOTES */
.note{
  padding:18px;
}

.note textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}

/* SETTINGS */
.setting-row{
  padding:18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-info h4{
  margin-bottom:5px;
}

.setting-info p{
  color:var(--muted);
  font-size:12px;
}

/* EMPTY */
.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}

/* OVERLAY */
.overlay{
  display:none;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:950;
  }

  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:700px){
  .content{
    padding:17px;
  }

  .topbar{
    padding:0 15px;
  }

  .top-title{
    display:none;
  }

  .hero{
    padding:24px;
    border-radius:20px;
  }

  .hero h2{
    font-size:25px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:23px;
  }

  .lesson-head{
    padding:20px;
  }

  .lesson-head h2{
    font-size:23px;
  }

  .lesson-head-top{
    flex-direction:column;
  }

  .lesson-row{
    align-items:flex-start;
  }

  .lesson-actions{
    flex-direction:column;
  }

  .lesson-actions .btn{
    padding:9px 11px;
  }

  .lesson-section,
  .practice,
  .quiz-card{
    padding:19px;
  }

  .lesson-nav{
    position:sticky;
    bottom:0;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    padding:12px 0;
    z-index:20;
  }
}
</style>
</head>

  id:1,

  duration:"7–10 min",

  trainerIntro:`
မင်္ဂလာပါ Manager ရေ

ဒီနေ့ Aung Business Academy ရဲ့ ပထမဆုံး Lesson ဖြစ်တဲ့ "Sales Manager Role" ကို လေ့လာပါမယ်

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function setActiveNav(page){

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  const el = document.getElementById("nav-"+page);

  if(el) el.classList.add("active");
}

function showPage(page){

  closeSidebar();

  setActiveNav(page);

  const content = document.getElementById("content");

  if(page==="dashboard"){
    document.getElementById("topTitle").textContent="Dashboard";
    renderDashboard();
  }

  if(page==="courses"){
    document.getElementById("topTitle").textContent="All Courses";
    renderCourses();
  }

  if(page==="classroom"){
    document.getElementById("topTitle").textContent="Trainer Classroom";
    renderTrainerHome();
  }

  if(page==="tools"){
    document.getElementById("topTitle").textContent="Manager Tools";
    renderTools();
  }

  if(page==="notes"){
    document.getElementById("topTitle").textContent="My Notes";
    renderNotes();
  }

  if(page==="favorites"){
    document.getElementById("topTitle").textContent="Favorites";
    renderFavorites();
  }

  if(page==="settings"){
    document.getElementById("topTitle").textContent="Settings";
    renderSettings();
  }
}

/* =========================================================
   QUIZ
========================================================= */

function answerQuiz(qi,oi){

  const lesson=lessonData[currentLessonId];
  const q=lesson.quiz[qi];

  const result=document.getElementById(`quiz-result-${qi}`);

  q.options.forEach((_,i)=>{
    const btn=document.getElementById(`quiz-${qi}-${i}`);

    if(btn){
      btn.classList.remove("correct","wrong");
    }
  });

  const selected=document.getElementById(`quiz-${qi}-${oi}`);

  if(oi===q.answer){

    selected.classList.add("correct");

    result.style.display="block";

    result.innerHTML=
      `✅ Correct<br><br>${escapeHtml(q.explanation)}`;

  }else{

    selected.classList.add("wrong");

    const correct=document.getElementById(
      `quiz-${qi}-${q.answer}`
    );

    if(correct){
      correct.classList.add("correct");
    }

    result.style.display="block";

    result.innerHTML=
      `❌ Correct Answer: ${String.fromCharCode(65+q.answer)}<br><br>
       ${escapeHtml(q.explanation)}`;
  }
}


/* =========================================================

function toggleComplete(id){

  if(state.completed.includes(id)){
    state.completed=state.completed.filter(x=>x!==id);
  }else{
    state.completed.push(id);
  }

  saveState();

  renderShell();

  if(document.getElementById("content")){
    openLesson(id);
  }
}


function toggleFavorite(id,moduleIndex){

  if(state.favorites.includes(id)){
    state.favorites=state.favorites.filter(x=>x!==id);
  }else{
    state.favorites.push(id);
  }

  saveState();

  openModule(moduleIndex);
}

function calculateKPI(){

  const target=Number(document.getElementById("kpiTarget").value)||0;
  const actual=Number(document.getElementById("kpiActual").value)||0;

  if(target<=0){
    document.getElementById("kpiResult").innerHTML=
      `<div class="tip-box">Target ထည့်ပါ</div>`;
    return;
  }

  const achievement=actual/target*100;
  const gap=target-actual;

  document.getElementById("kpiResult").innerHTML=`

    <div class="tip-box">

      <strong>Achievement</strong><br>
      ${achievement.toFixed(1)}%

      <br><br>

      <strong>Gap</strong><br>
      ${gap.toLocaleString()}

    </div>
  `;
}


function calculateForecast(){

  const actual=Number(document.getElementById("forecastActual").value)||0;
  const elapsed=Number(document.getElementById("forecastElapsed").value)||0;
  const total=Number(document.getElementById("forecastTotal").value)||0;

  if(actual<=0 || elapsed<=0 || total<=0){
    document.getElementById("forecastResult").innerHTML=
      `<div class="tip-box">Data အားလုံးထည့်ပါ</div>`;
    return;
  }

  const forecast=actual/elapsed*total;

  document.getElementById("forecastResult").innerHTML=`

    <div class="tip-box">

      <strong>Run Rate Forecast</strong><br>
      ${forecast.toLocaleString(undefined,{
        maximumFractionDigits:2
      })}

    </div>
  `;
}


function calculatePJP(){

  const customers=Number(document.getElementById("pjpCustomers").value)||0;
  const frequency=Number(document.getElementById("pjpFrequency").value)||0;

  const calls=customers*frequency;

  document.getElementById("pjpResult").innerHTML=`

    <div class="tip-box">

      <strong>Monthly Planned Calls</strong><br>
      ${calls.toLocaleString()}

    </div>
  `;
}

/* =========================================================
   CONTINUE LEARNING
========================================================= */

function getContinueLessonId(){

  for(let i=1;i<=230;i++){

    if(!state.completed.includes(i)){
      return i;
    }
  }

  return 1;
}


function continueLearning(){

  openLesson(getContinueLessonId());
}


function previousLesson(){

  if(currentLessonId>1){
    openLesson(currentLessonId-1);
  }
}


function nextLesson(){

  if(currentLessonId<230){

    if(!state.completed.includes(currentLessonId)){

      state.completed.push(currentLessonId);

      saveState();
    }

    openLesson(currentLessonId+1);
  }
}


/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value){

  if(value===undefined || value===null){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
