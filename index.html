<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aung Business Academy — Trainer Edition</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#697386;
  --border:#e7eaf0;
  --primary:#6d4aff;
  --primary2:#8b6cff;
  --soft:#f0ecff;
  --success:#13a673;
  --danger:#e55353;
  --warning:#f59e0b;
  --sidebar:#111827;
}

body{
  font-family:
    "Noto Sans Myanmar",
    "Myanmar Text",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:260px;
  background:var(--sidebar);
  color:white;
  padding:20px 14px;
  z-index:50;
  overflow-y:auto;
}

.brand{
  padding:8px 12px 24px;
}

.brand-title{
  font-size:20px;
  font-weight:800;
}

.brand-sub{
  color:#9ca3af;
  font-size:12px;
  margin-top:4px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:13px 14px;
  border-radius:12px;
  text-align:left;
  width:100%;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#252d3d;
  color:white;
}

.nav-icon{
  display:inline-block;
  width:28px;
}

/* MAIN */

.main{
  margin-left:260px;
  min-height:100vh;
}

.topbar{
  height:72px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.menu-btn{
  display:none;
  border:0;
  background:#f1f3f7;
  width:42px;
  height:42px;
  border-radius:12px;
}

.top-title{
  font-weight:800;
}

.top-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.progress-mini{
  font-size:13px;
  color:var(--muted);
}

.content{
  padding:28px;
  max-width:1400px;
  margin:auto;
}

/* CARDS */

.grid{
  display:grid;
  gap:18px;
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 20px rgba(15,23,42,.035);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
  margin-top:7px;
}

.stat-icon{
  font-size:24px;
  margin-bottom:8px;
}

.section-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}

.section-sub{
  color:var(--muted);
  margin-bottom:22px;
}

/* PROGRESS */

.progress{
  width:100%;
  height:9px;
  background:#eceef3;
  border-radius:999px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  border-radius:999px;
  transition:.4s;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:#5d3be8;
}

.btn-light{
  background:#f1f3f7;
  color:var(--text);
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

/* HERO */

.hero{
  background:
    linear-gradient(135deg,#17132d,#38256e 55%,#6544e9);
  color:white;
  border-radius:24px;
  padding:30px;
  margin-bottom:24px;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  right:-70px;
  top:-100px;
  background:rgba(255,255,255,.08);
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#ddd7ff;
  max-width:700px;
  line-height:1.8;
}

.hero-actions{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* SEARCH */

.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 15px;
  outline:none;
  background:white;
}

.search:focus{
  border-color:var(--primary);
}

/* LESSON */

.lesson-card{
  border:1px solid var(--border);
  background:white;
  border-radius:17px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
}

.lesson-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

.lesson-number{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
}

.lesson-title{
  font-size:16px;
  font-weight:800;
  margin:8px 0;
}

.lesson-desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.lesson-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:var(--soft);
  color:var(--primary);
  font-size:11px;
  font-weight:800;
}

/* TRAINER */

.trainer{
  background:#fff8e7;
  border:1px solid #f4dfaa;
  border-radius:18px;
  padding:20px;
  margin:18px 0;
}

.trainer-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.trainer-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(135deg,#6d4aff,#9b7dff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.trainer-name{
  font-weight:900;
}

.trainer-role{
  color:var(--muted);
  font-size:12px;
}

.trainer-text{
  line-height:2;
  color:#3b3525;
}

/* LESSON VIEW */

.lesson-header{
  margin-bottom:20px;
}

.lesson-header h1{
  font-size:30px;
  margin:8px 0;
}

.breadcrumb{
  color:var(--primary);
  font-size:13px;
  font-weight:800;
}

.learning-section{
  margin-top:22px;
}

.learning-section h2{
  font-size:19px;
  margin-bottom:12px;
}

.explain{
  line-height:2;
  color:#3e4655;
}

.example{
  background:#f6f7fb;
  border-left:4px solid var(--primary);
  padding:18px;
  border-radius:10px;
  line-height:2;
}

.insight{
  background:#eefbf6;
  border:1px solid #c9efdf;
  border-radius:15px;
  padding:18px;
  line-height:2;
}

.action{
  background:#f0ecff;
  border:1px solid #ddd4ff;
  border-radius:15px;
  padding:18px;
  line-height:2;
}

.checklist{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.check{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:12px;
  background:#fafafa;
  border:1px solid var(--border);
  border-radius:10px;
}

.quiz-option{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:white;
  padding:13px;
  border-radius:11px;
  margin-top:9px;
}

.quiz-option:hover{
  border-color:var(--primary);
}

.quiz-option.correct{
  background:#e9f9f2;
  border-color:var(--success);
}

.quiz-option.wrong{
  background:#fff0f0;
  border-color:var(--danger);
}

.quiz-result{
  margin-top:12px;
  font-weight:800;
}

textarea.note{
  width:100%;
  min-height:150px;
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px;
  resize:vertical;
  outline:none;
}

/* TOOL */

.tool-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tool-tab{
  border:1px solid var(--border);
  background:white;
  padding:10px 14px;
  border-radius:10px;
}

.tool-tab.active{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.input-group{
  margin-bottom:14px;
}

.input-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
}

.result-box{
  margin-top:16px;
  padding:18px;
  background:#f6f7fb;
  border-radius:14px;
}

.big-result{
  font-size:32px;
  font-weight:900;
  color:var(--primary);
}

/* MODULE */

.module{
  margin-bottom:18px;
}

.module-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:16px;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  cursor:pointer;
}

.module-title{
  font-weight:900;
}

.module-body{
  display:none;
  padding:14px 0 0;
}

.module.open .module-body{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:40;
}

/* MOBILE */

@media(max-width:1000px){
  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.show{
    display:block;
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 14px;
  }

  .content{
    padding:16px;
  }

  .grid-4,
  .grid-3,
  .grid-2{
    grid-template-columns:1fr;
  }

  .module.open .module-body{
    grid-template-columns:1fr;
  }

  .hero{
    padding:22px;
    border-radius:18px;
  }

  .hero h1{
    font-size:24px;
  }

  .lesson-header h1{
    font-size:24px;
  }

  .top-title{
    display:none;
  }
}
</style>
</head>

</div>

let state = JSON.parse(localStorage.getItem("aba_trainer_v1") || "{}");

if(!state.completed) state.completed=[];
if(!state.favorites) state.favorites=[];
if(!state.notes) state.notes={};
if(!state.streak) state.streak=1;
if(!state.lastStudy) state.lastStudy="";
if(!state.theme) state.theme="#6d4aff";

/* =========================================================
   HELPERS
   ========================================================= */

function save(){
  localStorage.setItem("aba_trainer_v1",JSON.stringify(state));
  updateTopProgress();
}

function allLessons(){

  const list=[];

  modules.forEach((m,mi)=>{
    m.lessons.forEach((l,li)=>{
      const number=mi*10+li+1;

      list.push({
        id:number,
        moduleId:m.id,
        moduleTitle:m.title,
        title:l[0],
        desc:l[1]
      });

    });
  });

  return list;
}

function getLesson(id){
  return allLessons().find(x=>x.id===Number(id));
}

function isCompleted(id){
  return state.completed.includes(Number(id));
}

function progressPercent(){

  return Math.round(
    state.completed.length / TOTAL_LESSONS * 100
  );
}

function updateTopProgress(){
  const el=document.getElementById("topProgress");
  if(el) el.textContent=progressPercent()+"%";
}

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showPage(page,button){

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(button) button.classList.add("active");

  closeSidebar();

  const title={
    dashboard:"Dashboard",
    courses:"All Courses",
    trainer:"Trainer Classroom",
    tools:"Manager Tools",
    notes:"My Notes",
    favorites:"Favorites",
    settings:"Settings"
  }[page] || "Aung Business Academy";

  document.getElementById("topTitle").textContent=title;

  if(page==="dashboard") renderDashboard();
  if(page==="courses") renderCourses();
  if(page==="trainer") renderTrainer();
  if(page==="tools") renderTools();
  if(page==="notes") renderNotes();
  if(page==="favorites") renderFavorites();
  if(page==="settings") renderSettings();

}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function filterLessons(){

  const q=document.getElementById("lessonSearch").value.toLowerCase();

  const filtered=modules.map(m=>({

    ...m,

    lessons:m.lessons.filter(l=>
      l[0].toLowerCase().includes(q) ||
      l[1].toLowerCase().includes(q) ||
      m.title.toLowerCase().includes(q)
    )

  })).filter(m=>m.lessons.length);

  renderCourseList(filtered);

}

/* =========================================================
   QUIZ
   ========================================================= */

function quiz(btn,correct){

  document.querySelectorAll(".quiz-option")
    .forEach(b=>{
      b.disabled=true;
    });

  if(correct){

    btn.classList.add("correct");

    document.getElementById("quizResult").innerHTML=
      "🎉 Correct — Achievement = Actual ÷ Target × 100 = 80%";

  }else{

    btn.classList.add("wrong");

    document.getElementById("quizResult").innerHTML=
      "❌ ပြန်စဉ်းစားကြည့်ပါ — Achievement = Actual ÷ Target × 100 ဖြစ်ပါတယ်";

  }

}


/* =========================================================
   COMPLETE
   ========================================================= */

function completeLesson(id){

  if(!state.completed.includes(id)){
    state.completed.push(id);
  }

  const today=new Date().toISOString().slice(0,10);

  if(state.lastStudy!==today){

    if(state.lastStudy){

      const last=new Date(state.lastStudy);
      const now=new Date(today);

      const diff=Math.round(
        (now-last)/(1000*60*60*24)
      );

      if(diff===1){
        state.streak++;
      }else{
        state.streak=1;
      }

    }else{
      state.streak=1;
    }

    state.lastStudy=today;
  }

  save();

  openLesson(id);

}

function toggleFavorite(id){

  const index=state.favorites.indexOf(id);

  if(index===-1){
    state.favorites.push(id);
  }else{
    state.favorites.splice(index,1);
  }

  save();

  if(currentLesson){
    openLesson(currentLesson.id);
  }

}

function renderFavorites(){

  const lessons=allLessons()
    .filter(l=>state.favorites.includes(l.id));

  document.getElementById("appContent").innerHTML=`

function toolKPI(btn){

  document.getElementById("toolArea").innerHTML=`

    <div class="card">

      <div class="grid grid-2" style="margin-top:18px">

        <div class="input-group">

          <input id="toolActual" class="input" type="number">

      <button class="btn btn-primary"
        onclick="toolCalculateKPI()">
        Calculate

      <div id="toolResult"></div>

    </div>

  `;

}

function toolCalculateKPI(){

  const target=Number(
    document.getElementById("toolTarget").value
  );

  const actual=Number(
    document.getElementById("toolActual").value
  );

  if(!target){

    document.getElementById("toolResult").innerHTML=
      `<div class="result-box">Target ထည့်ပါ</div>`;

    return;
  }

  const achievement=actual/target*100;
  const gap=actual-target;

  document.getElementById("toolResult").innerHTML=`

    <div class="result-box">

      <div>Achievement</div>

      <div class="big-result">
        ${achievement.toFixed(1)}%
      </div>

      <div style="margin-top:10px">
        Gap = ${gap.toFixed(1)}
      </div>

    </div>

  `;

}

function calculateKPI(){

  const target=Number(
    document.getElementById("kpiTarget").value
  );

  const actual=Number(
    document.getElementById("kpiActual").value
  );

  if(!target)return;

  const achievement=actual/target*100;
  const gap=actual-target;

  document.getElementById("kpiResult").innerHTML=`

    <div>
      Achievement

    <div class="big-result">
      ${achievement.toFixed(1)}%
    </div>

    <div>
      Gap = ${gap.toFixed(1)}
    </div>

}

function toolForecast(btn){

  document.querySelectorAll(".tool-tab")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  document.getElementById("toolArea").innerHTML=`

      <div class="input-group" style="margin-top:18px">

        <input id="forecastSales"
          class="input"
          type="number">
      </div>

      <div class="input-group">
        <label>Days Passed</label>
        <input id="forecastDays"
          class="input"
          type="number">
      </div>

      <div class="input-group">
        <label>Total Days</label>
        <input id="forecastTotal"
          class="input"
          type="number"
          value="30">
      </div>

      <button class="btn btn-primary"
        onclick="calculateForecast()">
        Forecast
      </button>

      <div id="forecastResult"></div>

    </div>

  `;

}

function calculateForecast(){

  const sales=Number(
    document.getElementById("forecastSales").value
  );

  const days=Number(
    document.getElementById("forecastDays").value
  );

  const total=Number(
    document.getElementById("forecastTotal").value
  );

  if(!sales || !days || !total)return;

  const forecast=sales/days*total;

  document.getElementById("forecastResult").innerHTML=`

    <div class="result-box">

      <div>Estimated Month-End Sales</div>

      <div class="big-result">
        ${forecast.toFixed(1)}
      </div>

    </div>

  `;

}

function toolPJP(btn){

  document.querySelectorAll(".tool-tab")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  document.getElementById("toolArea").innerHTML=`

      </div>

        onclick="calculatePJP()">

      <div id="pjpResult"></div>

    </div>

function calculatePJP(){

  const customers=Number(
    document.getElementById("pjpCustomers").value

  const days=Number(
    document.getElementById("pjpDays").value

  if(!customers || !days)return;

  const daily=customers/days;
