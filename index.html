function getProgress(){

 try{
  return JSON.parse(
   localStorage.getItem("aungAcademyProgress") || "{}"
  );
 }catch(e){
  return {};
 }

}

function getLessonProgress(id){

 const p=getProgress();

 return p[id] || {
  completed:false,
  score:0,
  favorite:false,
  notes:""
 };

}

function saveProgress(id,data){

 const p=getProgress();

 p[id]=Object.assign(
  getLessonProgress(id),
  data
 );

 localStorage.setItem(
  "aungAcademyProgress",
  JSON.stringify(p)
 );

 return p[id];
}


/* =========================================================
   ESCAPE
   ========================================================= */

function esc(value){

 if(value===null || value===undefined){
  return "";
 }

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================================
   OVERALL
   ========================================================= */

function getOverall(){

 let done=0;

 lessons.forEach(function(l){

  if(getLessonProgress(l.id).completed){
   done++;
  }

 });

 return {
  total:lessons.length,
  done:done,
  pct:lessons.length
   ? Math.round(done/lessons.length*100)
   : 0
 };

}


/* =========================================================
   MODULE PROGRESS
   ========================================================= */

function moduleProgress(moduleName){

 const arr=lessons.filter(function(l){
  return l.module===moduleName;
 });

 let done=0;

 arr.forEach(function(l){

  if(getLessonProgress(l.id).completed){
   done++;
  }

 });

 return {
  total:arr.length,
  done:done,
  pct:arr.length
   ? Math.round(done/arr.length*100)
   : 0
 };

}

/* =========================================================
   NAVIGATION
   ========================================================= */

function navigationButtons(id){

 const index=lessons.findIndex(function(l){
  return l.id===id;
 });

 let html=`
  <div class="actions" style="margin-top:25px">
 `;

 if(index>0){

  html+=`
   <button
    class="btn soft"
    onclick="openLesson(${lessons[index-1].id})"
   >
    ← Previous
   </button>
  `;

 }

 if(index<lessons.length-1){

  html+=`
   <button
    class="btn primary"
    onclick="openLesson(${lessons[index+1].id})"
   >
    Next →
   </button>
  `;

 }

 html+=`</div>`;

 return html;
}


/* =========================================================
   QUIZ
   ========================================================= */

let currentQuizAnswers=[];
let currentLessonId=null;

function answerQuiz(qIndex,optIndex){

 const lesson=lessons.find(function(l){
  return l.id===currentLessonId;
 });

 if(!lesson){
  return;
 }

 currentQuizAnswers[qIndex]=optIndex;

 const q=lesson.quiz[qIndex];

 const buttons=document.querySelectorAll(
  '[data-question="'+qIndex+'"]'
 );

 buttons.forEach(function(btn){

  const value=Number(
   btn.getAttribute("data-option")
  );

  btn.classList.remove("correct","wrong");

  if(value===q.answer){
   btn.classList.add("correct");
  }

  if(value===optIndex && value!==q.answer){
   btn.classList.add("wrong");
  }

 });

 const exp=document.getElementById(
  "explain-"+qIndex
 );

 exp.style.display="block";

 exp.innerHTML=
  "<b>"+(optIndex===q.answer ? "✓ Correct" : "✕ Review")+
  "</b><br>"+esc(q.explain);

 calculateQuiz();
}


function calculateQuiz(){

 const lesson=lessons.find(function(l){
  return l.id===currentLessonId;
 });

 if(!lesson){
  return;
 }

 let answered=0;
 let correct=0;

 lesson.quiz.forEach(function(q,index){

  if(currentQuizAnswers[index]!==undefined){

   answered++;

   if(
    Number(currentQuizAnswers[index])===
    Number(q.answer)
   ){
    correct++;
   }

  }

 });

 const box=document.getElementById("quizResult");

 box.style.display="block";

 const score=
  lesson.quiz.length
   ? Math.round(correct/lesson.quiz.length*100)
   : 0;

 box.innerHTML=
  "Quiz Progress: <b>"+
  answered+
  "/"+
  lesson.quiz.length+
  "</b> • Score: <b>"+
  score+
  "%</b>";

}


/* =========================================================
   COMPLETE LESSON
   ========================================================= */

function completeCurrentLesson(id){

 const lesson=lessons.find(function(l){
  return l.id===id;
 });

 if(!lesson){
  return;
 }

 let correct=0;

 lesson.quiz.forEach(function(q,index){

  if(
   Number(currentQuizAnswers[index])===
   Number(q.answer)
  ){
   correct++;
  }

 });

 const score=
  lesson.quiz.length
   ? Math.round(correct/lesson.quiz.length*100)
   : 0;

 saveProgress(id,{
  completed:true,
  score:score,
  completedAt:new Date().toISOString()
 });

 renderSidebar();
 renderCompletion(id);

}
