<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Aung Business Academy — Trainer Edition V2</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#697386;
  --line:#e6eaf0;
  --primary:#5b5bd6;
  --primary2:#7c3aed;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#dc2626;
  --dark:#111827;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:18px;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Myanmar",
    "Myanmar Text",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:#111827;
  color:white;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  overflow-y:auto;
  transition:.25s ease;
}

.brand{
  padding:24px 20px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand h1{
  font-size:19px;
  line-height:1.4;
}

.brand p{
  color:#9ca3af;
  font-size:12px;
  margin-top:5px;
}

.nav{
  padding:15px 12px 30px;
}

.nav-title{
  color:#6b7280;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px 10px 8px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#d1d5db;
  padding:12px 12px;
  margin-bottom:4px;
  border-radius:12px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.1);
  color:white;
}

.nav-icon{
  width:25px;
  text-align:center;
}

.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(255,255,255,.08);
  color:#9ca3af;
  font-size:11px;
}

/* MAIN */
.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-width:0;
}

.topbar{
  height:70px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  display:none;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
}

.page-title{
  font-weight:800;
  font-size:18px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
}

.content{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* COMMON */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:6px;
}

.section-sub{
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.7;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.btn-secondary{
  color:var(--text);
  background:#eef0f6;
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

.btn-danger{
  background:#fee2e2;
  color:#991b1b;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* DASHBOARD */
.hero{
  padding:28px;
  background:linear-gradient(135deg,#111827,#312e81);
  color:white;
  border-radius:24px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  right:-100px;
  top:-120px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}

.hero h2{
  font-size:30px;
  margin-bottom:8px;
  position:relative;
  z-index:1;
}

.hero p{
  color:#dbeafe;
  line-height:1.7;
  max-width:800px;
  position:relative;
  z-index:1;
}

.hero-actions{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  position:relative;
  z-index:1;
}

.hero .btn-secondary{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.15);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.progress{
  height:9px;
  background:#edf0f5;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  border-radius:999px;
}

/* MODULES */
.module-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.module-card{
  padding:20px;
  transition:.2s;
}

.module-card:hover{
  transform:translateY(-2px);
}

.module-number{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ede9fe;
  color:#6d28d9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-bottom:12px;
}

.module-card h3{
  font-size:16px;
  line-height:1.5;
}

.module-card p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.module-progress{
  margin-top:14px;
}

/* LESSON LIST */
.lesson-list{
  display:grid;
  gap:10px;
}

.lesson-row{
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
}

.lesson-row:hover{
  border-color:#c7d2fe;
}

.lesson-number{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#eef2ff;
  color:#4338ca;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
  flex-shrink:0;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h3{
  font-size:15px;
}

.lesson-info p{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.lesson-status{
  font-size:12px;
  font-weight:800;
}

/* TRAINER LESSON */
.lesson-head{
  padding:24px;
  margin-bottom:16px;
}

.lesson-head-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
}

.lesson-kicker{
  color:var(--primary);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.lesson-title{
  font-size:28px;
  margin-top:7px;
  line-height:1.35;
}

.lesson-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.badge{
  background:#f1f5f9;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.badge-purple{
  background:#ede9fe;
  color:#6d28d9;
}

.trainer-card{
  padding:22px;
  background:linear-gradient(135deg,#faf5ff,#eef2ff);
  border:1px solid #ddd6fe;
  margin-bottom:16px;
}

.trainer-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.trainer-avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:linear-gradient(135deg,#5b5bd6,#7c3aed);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.trainer-name{
  font-weight:900;
}

.trainer-role{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.trainer-speech{
  margin-top:16px;
  font-size:15px;
  line-height:2;
  white-space:pre-line;
}

.lesson-progress{
  padding:18px 20px;
  margin-bottom:16px;
}

.lesson-progress-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.section-card{
  padding:24px;
  margin-bottom:16px;
}

.section-label{
  color:var(--primary);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

.section-card h3{
  font-size:21px;
  margin-bottom:13px;
}

.section-body{
  line-height:2;
  white-space:pre-line;
  font-size:15px;
}

.trainer-question{
  margin-top:18px;
  padding:15px;
  border-left:4px solid var(--primary);
  background:#f8fafc;
  border-radius:0 12px 12px 0;
}

.trainer-question strong{
  display:block;
  margin-bottom:5px;
}

.example-box{
  background:#fffbeb;
  border:1px solid #fde68a;
}

.tip-box{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
}

.mistake-box{
  background:#fff1f2;
  border:1px solid #fecdd3;
}

.practice-box{
  background:#eff6ff;
  border:1px solid #bfdbfe;
}

.takeaway-list{
  padding-left:22px;
  line-height:2;
}

.quiz{
  display:grid;
  gap:12px;
}

.quiz-option{
  width:100%;
  text-align:left;
  padding:14px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
}

.quiz-option:hover{
  border-color:#a5b4fc;
  background:#f8faff;
}

.quiz-option.correct{
  background:#dcfce7;
  border-color:#86efac;
}

.quiz-option.wrong{
  background:#fee2e2;
  border-color:#fca5a5;
}

.quiz-result{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  line-height:1.8;
}

.lesson-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.notes{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  outline:none;
}

.notes:focus{
  border-color:#a5b4fc;
}

/* TOOLS */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.tool-card{
  padding:20px;
}

.tool-card h3{
  margin-bottom:7px;
}

.tool-card p{
  color:var(--muted);
  line-height:1.7;
  font-size:13px;
}

.form-group{
  margin-top:14px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.form-control{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  background:white;
}

.form-control:focus{
  border-color:#a5b4fc;
}

.result{
  margin-top:14px;
  padding:14px;
  background:#f8fafc;
  border-radius:12px;
  line-height:1.8;
}

/* SEARCH */
.search-box{
  margin-bottom:18px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
}

/* SETTINGS */
.setting-row{
  padding:18px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-row h3{
  font-size:15px;
}

.setting-row p{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

/* OVERLAY */
.overlay{
  display:none;
}

/* RESPONSIVE */
@media(max-width:1050px){
  .module-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .tools-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu-btn{
    display:block;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:40;
  }

  .overlay.show{
    display:block;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:0 15px;
  }

  .module-grid,
  .tools-grid{
    grid-template-columns:1fr;
  }

  .lesson-head-top{
    flex-direction:column;
  }

  .lesson-title{
    font-size:23px;
  }

  .section-card{
    padding:18px;
  }

  .hero{
    padding:22px;
  }

  .hero h2{
    font-size:24px;
  }
}

@media(max-width:520px){
  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat{
    padding:15px;
  }

  .stat-value{
    font-size:23px;
  }

  .lesson-row{
    padding:13px;
  }

  .lesson-number{
    width:36px;
    height:36px;
  }

  .top-actions{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>🎓 Aung Business Academy</h1>
      <p>Trainer Edition V2</p>
    </div>

    <nav class="nav">
      <div class="nav-title">Main</div>

      <button onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="nav-icon">🏠</span>
        Dashboard
      </button>

      <button onclick="showPage('courses')" id="nav-courses">
        <span class="nav-icon">📚</span>
        All Courses
      </button>

      <button onclick="showPage('trainer')" id="nav-trainer">
        <span class="nav-icon">🎓</span>
        Trainer Classroom
      </button>

      <button onclick="showPage('tools')" id="nav-tools">
        <span class="nav-icon">📊</span>
        Manager Tools
      </button>

      <button onclick="showPage('notes')" id="nav-notes">
        <span class="nav-icon">📝</span>
        My Notes
      </button>

      <button onclick="showPage('favorites')" id="nav-favorites">
        <span class="nav-icon">⭐</span>
        Favorites
      </button>

      <div class="nav-title">System</div>

      <button onclick="showPage('settings')" id="nav-settings">
        <span class="nav-icon">⚙️</span>
        Settings
      </button>
    </nav>

    <div class="sidebar-footer">
      230 Lessons • 23 Modules<br>
      Trainer-led learning system
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="page-title" id="pageTitle">Dashboard</div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="showPage('favorites')">⭐</button>
        <button class="icon-btn" onclick="showPage('settings')">⚙️</button>
      </div>
    </header>

    <div class="content" id="appContent"></div>

  </main>
</div>

<script>
/* =========================================================

   TRAINER EDITION V2
   230 LESSONS / 23 MODULES
========================================================= */

const MODULES = [

/* =========================================================
   STATE
========================================================= */

let state = JSON.parse(localStorage.getItem("aba_v2_state") || "{}");

state.completed = state.completed || [];
state.favorites = state.favorites || [];
state.notes = state.notes || {};
state.settings = state.settings || {
  trainerName:"Aung Business Academy Trainer",
  speech:true
};

let currentLesson = null;
let currentQuizAnswers = {};
let currentSection = 0;

/* =========================================================
   LESSON CREATION

========================================================= */

function flatLessons(){
  const arr=[];
  let id=1;

  MODULES.forEach((m,mi)=>{
    m[1].forEach((title,li)=>{
      arr.push({
        id,
        moduleIndex:mi,
        lessonIndex:li,
        module:m[0],
        title
      });
      id++;
    });
  });

  return arr;
}

const ALL_LESSONS = flatLessons();

function showPage(page){

  closeSidebar();

  document.querySelectorAll(".nav button").forEach(x=>{
    x.classList.remove("active");
  });

  const nav = document.getElementById("nav-"+page);
  if(nav) nav.classList.add("active");

  const titles={
    dashboard:"Dashboard",
    courses:"All Courses",
    trainer:"Trainer Classroom",
    tools:"Manager Tools",
    notes:"My Notes",
    favorites:"Favorites",
    settings:"Settings"
  };

  document.getElementById("pageTitle").textContent=titles[page] || "Aung Business Academy";

  if(page==="dashboard") renderDashboard();
  if(page==="courses") renderCourses();
  if(page==="trainer") renderTrainerHome();
  if(page==="tools") renderTools();
  if(page==="notes") renderNotes();
  if(page==="favorites") renderFavorites();
  if(page==="settings") renderSettings();
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function filterCourses(){

  const q=document.getElementById("courseSearch").value.toLowerCase();

  const filtered=ALL_LESSONS.filter(x=>
    x.title.toLowerCase().includes(q) ||
    x.module.toLowerCase().includes(q)
  );

  document.getElementById("courseResults").innerHTML=
    filtered.length
      ? filtered.map(lessonRow).join("")
      : `<div class="card" style="padding:25px;text-align:center">Lesson မတွေ့ပါ</div>`;
}

function lessonRow(x){

  const done=state.completed.includes(x.id);
  const fav=state.favorites.includes(x.id);

  return `

      <div class="lesson-number">${x.id}</div>

      <div class="lesson-info">
        <h3>${escapeHTML(x.title)}</h3>

      <div class="lesson-status">

}

    <div class="card section-card">

      <div class="section-label">KEY TAKEAWAYS</div>

      <h3>📌 မှတ်ထားရမယ့်အချက်များ</h3>

      <ul class="takeaway-list">
        ${lesson.takeaways.map(x=>`<li>${x}</li>`).join("")}
      </ul>

    </div>

    <div class="card section-card">

      <div class="section-label">MY NOTES</div>

      <h3>📝 ဒီ Lesson အတွက် Note ရေးပါ</h3>

      <textarea
        class="notes"
        id="lessonNotes"
        placeholder="ဒီ Lesson မှာ ကိုယ့်အတွက်အရေးကြီးတာတွေ ရေးထားပါ..."
        oninput="saveLessonNote()"
      >${escapeHTML(state.notes[lesson.id] || "")}</textarea>

    </div>

    <div class="card section-card"
      style="background:linear-gradient(135deg,#ecfdf5,#eff6ff)">

      <h3>🎓 Lesson Complete</h3>

      <p style="color:var(--muted);line-height:1.8;margin-top:8px">
        Quiz ဖြေပြီး Practice လုပ်ပြီးရင် ဒီ Lesson ကို Complete လုပ်ထားနိုင်ပါတယ်
      </p>

      <button
        class="btn ${state.completed.includes(lesson.id) ? "btn-success" : "btn-primary"}"
        style="margin-top:14px"
        onclick="toggleComplete(${lesson.id})">

        ${
          state.completed.includes(lesson.id)
          ? "✅ Completed"
          : "✓ Mark Lesson Complete"
        }

      </button>

    </div>
  `;
}

function nextSection(){

  const lesson=getLesson(currentLesson);

  if(currentSection < lesson.sections.length-1){
    currentSection++;
    renderLesson();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    goToFinalSection();
  }
}

function previousSection(){

  if(currentSection>0){
    currentSection--;
    renderLesson();
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function goToFinalSection(){

  const lesson=getLesson(currentLesson);

  currentSection=lesson.sections.length-1;

  renderLesson();

  setTimeout(()=>{
    document.querySelector(".mistake-box")?.scrollIntoView({
      behavior:"smooth"
    });
  },100);
}

/* =========================================================
   QUIZ
========================================================= */

function answerQuiz(qIndex,optIndex){

  const lesson=getLesson(currentLesson);
  const quiz=lesson.quiz[qIndex];

  quiz.options.forEach((_,i)=>{
    const el=document.getElementById(
      `quiz-${lesson.id}-${qIndex}-${i}`
    );

    if(el){
      el.classList.remove("correct","wrong");
      el.disabled=true;
    }
  });

  const selected=document.getElementById(
    `quiz-${lesson.id}-${qIndex}-${optIndex}`
  );

  const result=document.getElementById(
    `quiz-result-${lesson.id}-${qIndex}`
  );

  if(optIndex===quiz.answer){

    selected.classList.add("correct");

    result.style.display="block";
    result.innerHTML=
      "✅ မှန်ပါတယ် — "+quiz.explanation;

  }else{

    selected.classList.add("wrong");

    document.getElementById(
      `quiz-${lesson.id}-${qIndex}-${quiz.answer}`
    ).classList.add("correct");

    result.style.display="block";
    result.innerHTML=
      "❌ ဒီအဖြေမမှန်ပါ — "+quiz.explanation;
  }
}

/* =========================================================
   COMPLETE / FAVORITE / NOTES
========================================================= */

function toggleComplete(id){

  if(state.completed.includes(id)){
    state.completed=state.completed.filter(x=>x!==id);
  }else{
    state.completed.push(id);
  }

  saveState();
  renderLesson();
}

function toggleFavorite(id){

  if(state.favorites.includes(id)){
    state.favorites=state.favorites.filter(x=>x!==id);
  }else{
    state.favorites.push(id);
  }

  saveState();
  renderLesson();
}

function saveLessonNote(){

  const el=document.getElementById("lessonNotes");

  if(!el || !currentLesson) return;

  state.notes[currentLesson]=el.value;

  saveState();
}

function saveState(){
  localStorage.setItem("aba_v2_state",JSON.stringify(state));
}

/* =========================================================
   NOTES
========================================================= */

    </div>

    ${

        <div class="lesson-list">

              <div class="lesson-number">${x.id}</div>

========================================================= */

function renderFavorites(){

/* =========================================================
   MANAGER TOOLS
========================================================= */

function renderTools(){

  document.getElementById("appContent").innerHTML=`

    <div class="section-title">📊 Manager Tools</div>

    <div class="section-sub">
      Sales Manager အနေနဲ့ နေ့စဉ်အသုံးချနိုင်တဲ့ Quick Business Tools
    </div>

    <div class="tools-grid">

      <div class="card tool-card">

        <h3>📈 KPI Calculator</h3>

        <p>
          Target နဲ့ Actual ကိုထည့်ပြီး Achievement နဲ့ Gap ကိုတွက်ပါ
        </p>

        <div class="form-group">
          <label>Target</label>
          <input class="form-control" id="kpiTarget" type="number" placeholder="500">
        </div>

        <div class="form-group">
          <label>Actual</label>
          <input class="form-control" id="kpiActual" type="number" placeholder="420">
        </div>

        <button class="btn btn-primary" style="margin-top:14px"
          onclick="calculateKPI()">
          Calculate
        </button>

        <div id="kpiResult" class="result">
          Result ကို ဒီမှာပြပါမယ်
        </div>

      </div>


      <div class="card tool-card">

        <h3>🔮 Sales Forecast</h3>

        <p>
          Current Sales နဲ့ Days Elapsed ကိုအသုံးပြုပြီး Simple Run Rate Forecast တွက်ပါ
        </p>

        <div class="form-group">
          <label>Current Sales</label>
          <input class="form-control" id="forecastSales" type="number">
        </div>

        <div class="form-group">
          <label>Days Elapsed</label>
          <input class="form-control" id="forecastDays" type="number">
        </div>

        <div class="form-group">
          <label>Total Days</label>
          <input class="form-control" id="forecastTotalDays" type="number" value="30">
        </div>

        <button class="btn btn-primary" style="margin-top:14px"
          onclick="calculateForecast()">
          Forecast
        </button>

        <div id="forecastResult" class="result">
          Result ကို ဒီမှာပြပါမယ်
        </div>

      </div>


      <div class="card tool-card">

        <h3>📍 PJP Planner</h3>

        <p>
          Sales Rep တစ်ယောက်ရဲ့ Daily Calls ကို ခန့်မှန်းပြီး Monthly Capacity တွက်ပါ
        </p>

        <div class="form-group">
          <label>Calls / Day</label>
          <input class="form-control" id="pjpCalls" type="number" value="20">
        </div>

        <div class="form-group">
          <label>Working Days</label>
          <input class="form-control" id="pjpDays" type="number" value="26">
        </div>

        <button class="btn btn-primary" style="margin-top:14px"
          onclick="calculatePJP()">
          Calculate Capacity
        </button>

        <div id="pjpResult" class="result">
          Result ကို ဒီမှာပြပါမယ်
        </div>

      </div>

    </div>
  `;
}

function calculateKPI(){

  const target=Number(document.getElementById("kpiTarget").value);
  const actual=Number(document.getElementById("kpiActual").value);

  if(!target){
    document.getElementById("kpiResult").innerHTML=
      "Target ထည့်ပေးပါ";
    return;
  }

  const achievement=(actual/target)*100;
  const gap=target-actual;

  document.getElementById("kpiResult").innerHTML=`
    <strong>Achievement:</strong> ${achievement.toFixed(1)}%<br>
    <strong>Gap:</strong> ${gap.toLocaleString()}
  `;
}

function calculateForecast(){

  const sales=Number(document.getElementById("forecastSales").value);
  const days=Number(document.getElementById("forecastDays").value);
  const total=Number(document.getElementById("forecastTotalDays").value);

  if(!sales || !days || !total){
    document.getElementById("forecastResult").innerHTML=
      "Data အားလုံးထည့်ပေးပါ";
    return;
  }

  const daily=sales/days;
  const forecast=daily*total;

  document.getElementById("forecastResult").innerHTML=`
    <strong>Daily Run Rate:</strong> ${daily.toFixed(2)}<br>
    <strong>Projected Sales:</strong> ${forecast.toFixed(2)}
  `;
}

function calculatePJP(){

  const calls=Number(document.getElementById("pjpCalls").value);
  const days=Number(document.getElementById("pjpDays").value);

  const capacity=calls*days;

  document.getElementById("pjpResult").innerHTML=`
    <strong>Monthly Call Capacity:</strong> ${capacity.toLocaleString()} calls
  `;
}

/* =========================================================
   SETTINGS
========================================================= */

function renderSettings(){

  document.getElementById("appContent").innerHTML=`

    <div class="section-title">⚙️ Settings</div>

    <div class="section-sub">
      Academy Learning Settings
    </div>

    <div class="card" style="padding:22px">

      <div class="setting-row">

        <div>

          <p>Trainer Mode မှာပြမယ့် Trainer Name</p>

        <div>

        </div>

        <div>

function updateTrainerName(name){

  state.settings.trainerName=name;
  saveState();
}

function toggleSpeech(){

  state.settings.speech=!state.settings.speech;

  saveState();
  renderSettings();
}

function resetProgress(){

  const ok=confirm(
    "Progress, Favorites နဲ့ Notes အားလုံးကို ဖျက်မှာသေချာပါသလား"
  );

  if(!ok) return;

  state.completed=[];
  state.favorites=[];
  state.notes={};

  saveState();

  showPage("dashboard");
}

/* =========================================================
   SPEECH
========================================================= */

function speakCurrentLesson(){

  const lesson=getLesson(currentLesson);

  if(!lesson || !window.speechSynthesis) return;

  window.speechSynthesis.cancel();

  const section=lesson.sections[currentSection];

  const text=
    currentSection===0
    ? lesson.trainerIntro + " " + lesson.objective
    : section.body;

  const utterance=new SpeechSynthesisUtterance(text);

  utterance.lang="my-MM";
  utterance.rate=.88;
  utterance.pitch=1;

  window.speechSynthesis.speak(utterance);
}

/* =========================================================
   CONTINUE
========================================================= */

function getContinueLessonId(){

  for(let i=1;i<=230;i++){
    if(!state.completed.includes(i)){
      return i;
    }
  }

  return 230;
}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   INIT
========================================================= */

function init(){

  showPage("dashboard");
}

init();

</script>
